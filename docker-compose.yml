# Optional: a throwaway MySQL 8.0 for development.
# Teammates with a local MySQL install can skip this and run db/setup.sh against it instead.
services:
  mysql:
    image: mysql:8.0
    container_name: rms-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3307:3306"   # 3307 on the host so it never clashes with a local MySQL on 3306
    volumes:
      - rms-data:/var/lib/mysql

volumes:
  rms-data:
