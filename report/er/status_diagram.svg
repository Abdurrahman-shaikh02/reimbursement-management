<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" font-family="'Liberation Sans', Arial, Helvetica, sans-serif">
<rect width="100%" height="100%" fill="white"/>
<text x="40" y="34" font-size="19" text-anchor="start" font-weight="bold" fill="#1f2937">Claim status (reimbursement.status) — allowed transitions</text>
<text x="40" y="56" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b7280">Double border = final state. Any transition not drawn is rejected by trigger T1. C-numbers are constraints from the constraint catalogue.</text>
<circle cx="70" cy="170" r="9" fill="#1f2937"/>
<path d="M79,170 L140.0,170.0" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="miter"/>
<polygon points="150,170 139.0,175.0 139.0,165.0" fill="#1f2937"/>
<text x="114" y="158" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">INSERT</text>
<rect x="150.0" y="139.0" width="230" height="62" rx="10" fill="#e6edf7" stroke="#1f2937" stroke-width="1.5"/>
<text x="265" y="166" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1f2937">SUBMITTED</text>
<text x="265" y="185" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b7280">approved_by, approval_date NULL</text>
<path d="M380,170 L580.0,170.0" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="miter"/>
<polygon points="590,170 579.0,175.0 579.0,165.0" fill="#1f2937"/>
<text x="485" y="136" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">manager approves</text>
<text x="485" y="152" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b7280">C10 not own claim · T1 total ≤ limit</text>
<rect x="590.0" y="139.0" width="230" height="62" rx="10" fill="#e6edf7" stroke="#1f2937" stroke-width="1.5"/>
<text x="705" y="166" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1f2937">APPROVED</text>
<text x="705" y="185" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b7280">approved_by, approval_date set</text>
<path d="M820,170 L1000.0,170.0" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="miter"/>
<polygon points="1010,170 999.0,175.0 999.0,165.0" fill="#1f2937"/>
<text x="915" y="152" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f2937">marked paid</text>
<rect x="1015.0" y="134.0" width="140" height="72" rx="14" fill="white" stroke="#1f2937" stroke-width="1.3"/>
<rect x="1020.0" y="139.0" width="130" height="62" rx="10" fill="#e6edf7" stroke="#1f2937" stroke-width="1.5"/>
<text x="1085" y="166" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1f2937">PAID</text>
<text x="1085" y="185" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b7280">final</text>
<path d="M265,201 L265.0,290.0" fill="none" stroke="#1f2937" stroke-width="1.6" stroke-linejoin="miter"/>
<polygon points="265,300 260.0,289.0 270.0,289.0" fill="#1f2937"/>
<text x="280" y="255" font-size="12" text-anchor="start" font-weight="bold" fill="#1f2937">manager rejects</text>
<text x="280" y="271" font-size="12" text-anchor="start" font-weight="normal" fill="#6b7280">C9: remarks required</text>
<rect x="145.0" y="300.0" width="240" height="72" rx="14" fill="white" stroke="#1f2937" stroke-width="1.3"/>
<rect x="150.0" y="305.0" width="230" height="62" rx="10" fill="#e6edf7" stroke="#1f2937" stroke-width="1.5"/>
<text x="265" y="332" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#1f2937">REJECTED</text>
<text x="265" y="351" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#6b7280">final; remarks NOT NULL</text>
<text x="430" y="336" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b7280">Expense items may be added, changed or deleted only while the claim is SUBMITTED (trigger T2).</text>
<text x="430" y="356" font-size="12.5" text-anchor="start" font-weight="normal" fill="#6b7280">Every move out of SUBMITTED records approved_by and approval_date (CHECK C8).</text>
</svg>
